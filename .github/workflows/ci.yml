name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Use Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20.x'
        
    - name: Install Backend Dependencies
      run: |
        cd backend
        npm ci
        
    - name: Typecheck Backend
      run: |
        cd backend
        npx tsc --noEmit
        
    - name: Run Backend Tests
      run: |
        cd backend
        npm run test
